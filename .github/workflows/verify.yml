name: Verify site and engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Line-by-line verification gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Engine unit tests (dependency-free runner)
        run: python3 tools/run_tests.py
      - name: Generated review pages are up to date
        run: python3 tools/build_review.py --check
      - name: Official-source / link / table-row gate
        run: python3 tools/check_site.py
