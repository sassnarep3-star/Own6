name: Lab CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen upstream inventory in audit_sources.py needs historical commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-empirical.txt

      - name: Audit upstream evidence
        run: |
          python scripts/audit_sources.py 2>&1 | tail -40 || {
            python scripts/audit_sources.py 2>&1 | tail -40 | sed 's/^/::error::/'; exit 1; }

      - name: Run fail-closed empirical lab
        run: python scripts/run_lab.py

      - name: Build empirical dashboard
        run: python scripts/build_lab.py

      - name: Check lab data, report, and site
        run: python scripts/check_lab.py

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/ > /tmp/pytest.txt 2>&1
          status=$?
          grep -E "^(FAILED|ERROR|E  |_____)" /tmp/pytest.txt | head -40 | sed 's/^/::error::/'
          tail -5 /tmp/pytest.txt | sed 's/^/::error::/'
          exit $status

      - name: Verify no fabricated data in report
        run: python scripts/check_report.py

      - name: Check generated review and official-source gates
        run: |
          python tools/build_review.py --check
          python tools/check_site.py
          python scripts/check_site.py
          python scripts/linkcheck.py
