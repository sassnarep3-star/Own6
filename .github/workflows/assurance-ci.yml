name: Assurance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-empirical.txt
      - name: Audit current tree and legacy provenance
        run: python scripts/audit_repo.py
      - name: Run fail-closed empirical lab
        run: python scripts/run_lab.py
      - name: Build assurance dashboard
        run: python scripts/build_assurance.py
      - name: Check assurance dashboard and evidence state
        run: python scripts/check_assurance.py
      - name: Generated assurance artifacts are committed
        run: |
          git diff -- data/assurance docs/assurance > /tmp/assurance.diff || true
          if [ -s /tmp/assurance.diff ]; then
            {
              echo '## Assurance generated diff'
              echo '```diff'
              head -200 /tmp/assurance.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q tests
      - name: Verify fail-closed report
        run: python scripts/check_report.py
      - name: Release integrity gate
        run: python tools/release_gate.py
