name: nfl-8362b702

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/nfl_8362b702/**'
      - 'scripts/build_nfl_8362b702.py'
      - 'scripts/check_nfl_8362b702.py'
      - 'tests/test_nfl_8362b702.py'
      - 'data/nfl_8362b702/**'
      - 'docs/nfl-8362b702/**'
  pull_request:
    paths:
      - 'src/nfl_8362b702/**'
      - 'scripts/build_nfl_8362b702.py'
      - 'scripts/check_nfl_8362b702.py'
      - 'tests/test_nfl_8362b702.py'
      - 'data/nfl_8362b702/**'
      - 'docs/nfl-8362b702/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pack (zero inputs, network-free)
        run: python3 scripts/build_nfl_8362b702.py
      - name: Verify (rules 1-14)
        run: python3 scripts/check_nfl_8362b702.py
      - name: Tests (verifier + identities + determinism)
        run: python3 tests/test_nfl_8362b702.py
