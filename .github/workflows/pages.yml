name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check local links in published pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('docs'); errors=[]
          for page in root.rglob('*.html'):
              for target in re.findall(r'(?:href|src)=["\']([^"\']+)', page.read_text()):
                  if target.startswith(('http://','https://','mailto:','#')): continue
                  rel=target.split('#')[0]
                  if rel and not (page.parent/rel).exists(): errors.append(f'{page}: missing {rel}')
          if errors: raise SystemExit('\n'.join(errors))
          print('Published documentation links checked')
          PY
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
