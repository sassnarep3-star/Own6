name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = list(Path('.').glob('*.html'))
          errors=[]
          for page in html:
              text=page.read_text()
              for target in re.findall(r'(?:href|src)="([^"#][^"]*)"', text):
                  if target.startswith(('http://','https://','mailto:')) or '${' in target: continue
                  path=target.split('#')[0]
                  if path and not Path(path).exists(): errors.append(f'{page}: missing {path}')
          if errors: raise SystemExit('\n'.join(errors))
          print(f'Checked local links in {len(html)} HTML pages')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
