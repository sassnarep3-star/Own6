name: Legacy parlay safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/b700d3ca-own6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parlay-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dependency-free mathematical and review-page regressions
        run: python3 tools/run_tests.py
      - name: Check published links and release integrity
        run: python3 tools/release_gate.py
