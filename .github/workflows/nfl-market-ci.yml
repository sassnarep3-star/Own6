name: NFL market pack

on:
  push:
    paths:
      - "src/nfl_market/**"
      - "scripts/build_nfl_market.py"
      - "scripts/check_nfl_market.py"
      - "tests/test_nfl_market.py"
      - "data/nfl_market/**"
      - "docs/nfl-market/**"
      - ".github/workflows/nfl-market-ci.yml"
  pull_request:
    paths:
      - "src/nfl_market/**"
      - "scripts/build_nfl_market.py"
      - "scripts/check_nfl_market.py"
      - "tests/test_nfl_market.py"
      - "data/nfl_market/**"
      - "docs/nfl-market/**"
      - ".github/workflows/nfl-market-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify nfl_market pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build must be reproducible
        run: |
          python3 scripts/build_nfl_market.py
          git diff --exit-code -- data/nfl_market docs/nfl-market \
            || { echo "::error::generated artefacts are stale; rerun scripts/build_nfl_market.py"; exit 1; }

      - name: Line-by-line source gate
        run: python3 scripts/check_nfl_market.py

      - name: Regression tests
        run: python3 -m unittest discover -s tests -p "test_nfl_market.py" -v
