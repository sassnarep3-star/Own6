name: NFL a119bb6d capture

# Scheduled capture of the official NFL availability pages and Game Books.
#
#   Wed/Thu/Fri 21:00 UTC  -> the league's injury-report hub and the weekly
#                              inactive-list article (practice reports are
#                              published during the afternoon in the US).
#   Mon 05:00 UTC          -> the Game Book PDFs for the week just finished,
#                              the archived weekly injury reports of the past
#                              season, and the 32 club roster pages.
#
# Every capture writes a manifest with the URL, the read time and the SHA-256
# of the bytes that were read. The manifest is uploaded as an artifact so the
# capture is auditable and replayable: a reviewer can re-download the same
# document and confirm the hash.

on:
  push:
    branches:
      - 'arena/a119bb6d-own6'
    paths:
      - 'scripts/capture_nfl_a119bb6d.py'
      - 'src/nfl_a119bb6d/net.py'
      - '.github/workflows/nfl-a119bb6d-capture.yml'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Week numbers to capture (comma separated, empty for none)'
        required: false
        default: '10'
      archive_seasons:
        description: 'Past seasons whose weekly injury reports are archived'
        required: false
        default: ''
      rosters:
        description: 'Also capture the 32 club roster pages'
        required: false
        default: false
        type: boolean
      no_gamebooks:
        description: 'Skip the game centre / Game Book capture'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 21 * * 3,4,5'
    - cron: '0 5 * * 1'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install capture dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pypdf
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Decide what this run captures
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          IN_WEEKS: ${{ inputs.weeks || '' }}
          IN_ARCHIVE: ${{ inputs.archive_seasons || '' }}
          IN_ROSTERS: ${{ inputs.rosters || '' }}
          IN_NO_GB: ${{ inputs.no_gamebooks || '' }}
        run: |
          set -euo pipefail
          weeks="$IN_WEEKS"
          extra=""
          archive=""
          rosters=""
          no_gb=""
          if [ "$EVENT" = "schedule" ]; then
            day=$(date -u +%u)
            if [ "$day" = "1" ]; then
              weeks="10"
              archive="2025"
              rosters="--rosters"
              echo "Scheduled Monday run: the Game Books of the week just finished, the archived weekly injury reports and the club rosters."
            else
              weeks="11"
              no_gb="--no-gamebooks"
              echo "Scheduled Wed/Thu/Fri run: this week's injury report and the inactive article."
            fi
          else
            archive="$IN_ARCHIVE"
            [ -n "$IN_ROSTERS" = "true" ] && rosters="--rosters"
            [ -n "$IN_NO_GB" = "true" ] && no_gb="--no-gamebooks"
            if [ -z "$weeks" ]; then
              weeks="9,10"
              archive="2025"
              rosters="--rosters"
              echo "Push-triggered run: capturing weeks 9 and 10, the archived 2025 injury reports and the club rosters."
            fi
          fi
          echo "weeks=$weeks" >> "$GITHUB_OUTPUT"
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "rosters=$rosters" >> "$GITHUB_OUTPUT"
          echo "no_gb=$no_gb" >> "$GITHUB_OUTPUT"

      - name: Run the capture
        run: |
          python3 scripts/capture_nfl_a119bb6d.py \
            --weeks "${{ steps.plan.outputs.weeks }}" \
            --archive-seasons "${{ steps.plan.outputs.archive }}" \
            --matchups data/nfl_a119bb6d/matchups.csv \
            --out "capture" \
            --diagnostic capture/diagnostic.txt \
            ${{ steps.plan.outputs.rosters }} ${{ steps.plan.outputs.no_gb }}

      - name: Summary
        run: python3 scripts/summarise_capture.py capture/capture_log.csv

      - name: Commit the capture manifest and the parsed outputs
        run: |
          set -euo pipefail
          mkdir -p data/nfl_a119bb6d/_capture data/nfl_a119bb6d/parsed
          cp capture/capture_log.csv data/nfl_a119bb6d/_capture/capture_log.csv
          if [ -f capture/diagnostic.txt ]; then
            cp capture/diagnostic.txt data/nfl_a119bb6d/_capture/diagnostic.txt
          fi
          if [ -d capture/parsed ]; then
            cp capture/parsed/*.csv data/nfl_a119bb6d/parsed/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_a119bb6d/_capture data/nfl_a119bb6d/parsed
          if git diff --cached --quiet; then
            echo "no capture output to commit"
            exit 0
          fi
          git commit -m "capture: official NFL read at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload the capture
        uses: actions/upload-artifact@v4
        with:
          name: nfl-a119bb6d-capture-${{ github.run_id }}
          path: capture/
          retention-days: 90
