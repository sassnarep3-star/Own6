name: nfl-a67ddef8

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/nfl_a67ddef8/**'
      - 'scripts/build_nfl_a67ddef8.py'
      - 'scripts/build_nfl_a67ddef8_data.py'
      - 'scripts/check_nfl_a67ddef8.py'
      - 'tests/test_nfl_a67ddef8.py'
      - 'data/nfl_a67ddef8/**'
      - 'docs/nfl-a67ddef8/**'
  pull_request:
    paths:
      - 'src/nfl_a67ddef8/**'
      - 'scripts/build_nfl_a67ddef8.py'
      - 'scripts/build_nfl_a67ddef8_data.py'
      - 'scripts/check_nfl_a67ddef8.py'
      - 'tests/test_nfl_a67ddef8.py'
      - 'data/nfl_a67ddef8/**'
      - 'docs/nfl-a67ddef8/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild data CSVs from raw transcriptions (no network)
        run: python3 scripts/build_nfl_a67ddef8_data.py
      - name: Check the data tree is unchanged by the rebuild (determinism)
        run: git diff --exit-code -- data/nfl_a67ddef8
      - name: Build the pack site
        run: python3 scripts/build_nfl_a67ddef8.py
      - name: Check the docs tree is unchanged by the rebuild (determinism)
        run: git diff --exit-code -- docs/nfl-a67ddef8
      - name: Run the pack verifier (15 rules)
        run: python3 scripts/check_nfl_a67ddef8.py
      - name: Run pack unit tests
        run: python3 tests/test_nfl_a67ddef8.py
