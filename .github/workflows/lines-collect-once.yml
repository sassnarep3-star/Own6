name: Lines collect (once)

# One-shot collector for session 55ad5ede. Runs when this file is pushed to
# arena/55ad5ede-own6, fetches official NBA results from nba.com on the
# runner, and pushes the refreshed dataset back to the same branch.

on:
  push:
    branches:
      - arena/55ad5ede-own6
    paths:
      - ".github/workflows/lines-collect-once.yml"
      - "scripts/collect_lines_data.py"
      - "data/lines/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lines-collect-once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe network reachability
        if: always()
        run: |
          {
            echo '### Reachability probe'
            for u in \
              "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json" \
              "https://www.nba.com/games?date=2026-11-04" \
              "https://www.nba.com/standings" ; do
              echo "--- $u"
              code=$(curl -sS -o /tmp/probe.out -w '%{http_code} %{size_download}' --max-time 45 \
                     -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/124.0' "$u" 2>&1) || true
              echo "status: $code"
              head -c 400 /tmp/probe.out 2>/dev/null || true
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect official NBA results from nba.com
        run: |
          set -o pipefail
          python3 scripts/collect_lines_data.py --out data/lines \
            --start 2026-10-20 --end 2026-11-04 2>&1 | tee collect.log || true
          {
            echo '```'
            echo '### Collector output'
            echo '```'
            cat collect.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p data/lines/_diagnostics
          cp collect.log data/lines/_diagnostics/collect.log || true

      - name: Inspect the raw payloads
        if: always()
        run: |
          {
            echo '### Cached payloads'
            ls -la data/lines/raw 2>/dev/null || echo 'no raw directory'
            for f in data/lines/raw/*.json; do
              [ -e "$f" ] || continue
              echo "--- $f (first 600 bytes) ---"
              head -c 600 "$f"
              echo
            done
            for f in data/lines/raw/*.html; do
              [ -e "$f" ] || continue
              echo "--- $f (size $(wc -c < "$f")) ---"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show what changed
        if: always()
        run: |
          {
            git --no-pager diff --stat -- data/lines || true
            echo '### Results head'
            head -5 data/lines/nba_results_official.csv 2>/dev/null || echo 'no results csv'
            wc -l data/lines/nba_results_official.csv 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the refreshed dataset
        if: always()
        run: |
          git config user.name "own6-lines-bot"
          git config user.email "own6-lines-bot@users.noreply.github.com"
          git add -A data/lines || true
          if git diff --cached --quiet; then
            echo "no dataset change"
            exit 0
          fi
          git commit -m "data(lines): official NBA results and standings collected from nba.com" || true
          git push origin HEAD:${{ github.ref_name }} || true
