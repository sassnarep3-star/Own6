name: nfl-cdf86c07-ci
on:
  push:
    paths:
      - "data/nfl_cdf86c07/**"
      - "docs/nfl-cdf86c07/**"
      - "scripts/build_nfl_cdf86c07.py"
      - "scripts/check_nfl_cdf86c07.py"
      - "tests/test_nfl_cdf86c07.py"
      - ".github/workflows/nfl-cdf86c07-ci.yml"
  pull_request:
    paths:
      - "data/nfl_cdf86c07/**"
      - "docs/nfl-cdf86c07/**"
      - "scripts/build_nfl_cdf86c07.py"
      - "scripts/check_nfl_cdf86c07.py"
      - "tests/test_nfl_cdf86c07.py"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Rebuild pack and require byte-identical output
        run: |
          python scripts/build_nfl_cdf86c07.py
          git diff --exit-code -- data/nfl_cdf86c07 docs/nfl-cdf86c07
      - name: Verifier
        run: python scripts/check_nfl_cdf86c07.py
      - name: Tests
        run: python -m pytest -q tests/test_nfl_cdf86c07.py
