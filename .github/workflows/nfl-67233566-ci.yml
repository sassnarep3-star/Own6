name: NFL 67233566 Pack Gate

# Owns src/nfl_67233566, data/nfl_67233566 and docs/nfl-67233566. Path-filtered so it only runs
# for this pack; the repository-wide gates (release-gate, verify, source-coverage) still run on
# every pull request. The pack refuses to publish if its own verifier fails, so CI's job is to
# prove the committed artefacts are what the frozen capture produces - nothing here is hand-typed.

on:
  push:
    branches: [main]
    paths:
      - "src/nfl_67233566/**"
      - "data/nfl_67233566/**"
      - "docs/nfl-67233566/**"
      - "scripts/build_nfl_67233566.py"
      - "scripts/check_nfl_67233566.py"
      - "tests/test_nfl_67233566.py"
      - "NFL_67233566_EXECUTIVE_SUMMARY.md"
      - "audit/NFL_67233566_REPO_AND_SOURCE_AUDIT.md"
      - ".github/workflows/nfl-67233566-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/nfl_67233566/**"
      - "data/nfl_67233566/**"
      - "docs/nfl-67233566/**"
      - "scripts/build_nfl_67233566.py"
      - "scripts/check_nfl_67233566.py"
      - "tests/test_nfl_67233566.py"
      - "NFL_67233566_EXECUTIVE_SUMMARY.md"
      - "audit/NFL_67233566_REPO_AND_SOURCE_AUDIT.md"
      - ".github/workflows/nfl-67233566-ci.yml"

permissions:
  contents: read

jobs:
  verify-nfl-67233566:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure stdlib, no network)
        run: python3 -m unittest discover -s tests -p "test_nfl_67233566.py" -v
      - name: Rebuild every table and page from the frozen capture
        run: python3 scripts/build_nfl_67233566.py
      - name: Line-by-line verifier (sources, blanks, chain, gates, walk-forward)
        run: python3 scripts/check_nfl_67233566.py
      - name: Rebuilt artefacts must be byte-identical to what is committed
        run: |
          git add -A -- data/nfl_67233566 docs/nfl-67233566
          git diff --cached --quiet -- data/nfl_67233566 docs/nfl-67233566 \
            || { echo "::error::committed artefacts differ from a fresh build"; \
                 git --no-pager diff --cached --stat -- data/nfl_67233566 docs/nfl-67233566; \
                 exit 1; }
      - name: The pre-registration hash must still name an ancestor commit
        run: |
          sha=$(tr -d '[:space:]' < data/nfl_67233566/claim_commit.txt)
          git merge-base --is-ancestor "$sha" HEAD \
            || { echo "::error::claim commit $sha is not an ancestor of HEAD"; exit 1; }
          echo "pre-registration claim commit: $sha"
      - name: Repository release gate
        run: python3 tools/release_gate.py
