name: NFL 48217A55 Pack Gate

# Owns src/nfl_48217a55, data/nfl_48217a55 and docs/nfl-48217a55. Path-filtered so it
# only runs for this pack; the repository-wide gates (release-gate, verify, source-coverage)
# still run on every pull request.

on:
  push:
    branches: [main]
    paths:
      - "src/nfl_48217a55/**"
      - "data/nfl_48217a55/**"
      - "docs/nfl-48217a55/**"
      - "scripts/build_nfl_48217a55.py"
      - "scripts/check_nfl_48217a55.py"
      - "tests/test_nfl_48217a55.py"
      - "NFL_48217A55_EXECUTIVE_SUMMARY.md"
      - ".github/workflows/nfl-48217a55-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/nfl_48217a55/**"
      - "data/nfl_48217a55/**"
      - "docs/nfl-48217a55/**"
      - "scripts/build_nfl_48217a55.py"
      - "scripts/check_nfl_48217a55.py"
      - "tests/test_nfl_48217a55.py"
      - "NFL_48217A55_EXECUTIVE_SUMMARY.md"
      - ".github/workflows/nfl-48217a55-ci.yml"

permissions:
  contents: read

jobs:
  verify-nfl-48217a55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure stdlib, no network)
        run: python3 -m unittest discover -s tests -p "test_nfl_48217a55.py" -v
      - name: Rebuild every table and page from the captured source values
        run: python3 scripts/build_nfl_48217a55.py
      - name: Line-by-line verifier
        run: python3 scripts/check_nfl_48217a55.py
      - name: Rebuilt artefacts must be byte-identical to what is committed
        run: |
          git add -A -- data/nfl_48217a55 docs/nfl-48217a55
          git diff --cached --quiet -- data/nfl_48217a55 docs/nfl-48217a55 \
            || { echo "::error::committed artefacts differ from a fresh build"; \
                 git --no-pager diff --cached --stat -- data/nfl_48217a55 docs/nfl-48217a55; \
                 exit 1; }
      - name: Repository release gate
        run: python3 tools/release_gate.py
