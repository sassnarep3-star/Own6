name: Release integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject merge markers, broken links and malformed landing rows
        run: python3 tools/release_gate.py
      - name: Verify generated lab tables and source links
        run: python3 scripts/check_lab.py
      - name: Verify published lab matches its source
        run: |
          python3 scripts/build_lab.py
          git diff --exit-code -- docs/lab/
      - name: Exercise failure-path regressions
        run: python3 -m unittest discover -s tests -p test_release_gate.py -v
