name: Rental research verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rental dashboard
        run: python scripts/build_rental.py
      - name: Verify no drift from committed pages
        run: git diff --exit-code -- docs/rental
      - name: Check rental tables, sources, links and math
        run: python scripts/check_rental.py
      - name: Run rental regression tests
        run: python -m unittest discover -s tests -p test_rental.py -v
      - name: Release integrity gate (published HTML)
        run: python tools/release_gate.py
