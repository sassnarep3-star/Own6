name: NFL D966F630 Pack Gate

# Owns src/nfl_d966f630, data/nfl_d966f630 and docs/nfl-d966f630. Path-filtered so
# it only runs for this pack; the repository-wide gates (release-gate, verify)
# still run on every pull request.

on:
  push:
    branches: [main]
    paths:
      - "src/nfl_d966f630/**"
      - "data/nfl_d966f630/**"
      - "docs/nfl-d966f630/**"
      - "scripts/build_nfl_d966f630.py"
      - "scripts/check_nfl_d966f630.py"
      - "tests/test_nfl_d966f630.py"
      - "NFL_D966F630_EXECUTIVE_SUMMARY.md"
      - "audit/NFL_D966F630_REPO_AND_SOURCE_AUDIT.md"
      - ".github/workflows/nfl-d966f630-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/nfl_d966f630/**"
      - "data/nfl_d966f630/**"
      - "docs/nfl-d966f630/**"
      - "scripts/build_nfl_d966f630.py"
      - "scripts/check_nfl_d966f630.py"
      - "tests/test_nfl_d966f630.py"
      - "NFL_D966F630_EXECUTIVE_SUMMARY.md"
      - "audit/NFL_D966F630_REPO_AND_SOURCE_AUDIT.md"
      - ".github/workflows/nfl-d966f630-ci.yml"

permissions:
  contents: read

jobs:
  verify-nfl-d966f630:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure stdlib, no network)
        run: python3 -m unittest discover -s tests -p "test_nfl_d966f630.py" -v
      - name: Rebuild every table and page from the captured source values
        run: python3 scripts/build_nfl_d966f630.py
      - name: Line-by-line verifier
        run: python3 scripts/check_nfl_d966f630.py
      - name: Rebuilt artefacts must be byte-identical to what is committed
        run: |
          git add -A -- data/nfl_d966f630 docs/nfl-d966f630
          git diff --cached --quiet -- data/nfl_d966f630 docs/nfl-d966f630 \
            || { echo "::error::committed artefacts differ from a fresh build"; \
                 git --no-pager diff --cached --stat -- data/nfl_d966f630 docs/nfl-d966f630; \
                 exit 1; }
      - name: Repository release gate
        run: python3 tools/release_gate.py
